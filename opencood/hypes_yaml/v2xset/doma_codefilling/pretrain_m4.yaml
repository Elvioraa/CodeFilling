name: CodeFilling_DOMA_v2xset_pretrain_m4
root_dir: dataset/V2XSET/train
validate_dir: dataset/V2XSET/validate
test_dir: dataset/V2XSET/test
yaml_parser: load_general_params
train_params:
  batch_size: 1
  epoches: 30
  max_cav: 5
  eval_freq: 1
  save_freq: 1
  single_weight: 1.0
comm_range: 70
input_source:
- camera
label_type: camera
cav_lidar_range: &id001
- -51.2
- -51.2
- -3
- 51.2
- 51.2
- 1
heter:
  assignment_path: opencood/modality_assign/v2xset_4modality.json
  ego_modality: m4
  mapping_dict:
    m1: m4
    m2: m4
    m3: m4
    m4: m4
  modality_setting:
    m4:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf:
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
      data_aug_conf:
        resize_lim:
        - 0.56
        - 0.61
        final_dim:
        - 336
        - 448
        rot_lim:
        - -3.6
        - 3.6
        H: 600
        W: 800
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
  lidar_channels_dict: {}
fusion:
  core_method: lateheter
  dataset: v2xset
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *id001
postprocess:
  core_method: VoxelPostprocessor
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id002
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 150
  nms_thresh: 0.15
  dir_args:
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id002
model:
  core_method: codefilling_doma
  args:
    ego_modality: m4
    lidar_range: &id003
    - -51.2
    - -51.2
    - -3
    - 51.2
    - 51.2
    - 1
    fix_encoder: false
    m4:
      core_method: lift_splat_shoot
      sensor_type: camera
      encoder_args:
        anchor_number: 2
        grid_conf: &id004
          xbound:
          - -51.2
          - 51.2
          - 0.4
          ybound:
          - -51.2
          - 51.2
          - 0.4
          zbound:
          - -10
          - 10
          - 20.0
          ddiscr:
          - 2
          - 50
          - 48
          mode: LID
        data_aug_conf:
          resize_lim:
          - 0.56
          - 0.61
          final_dim:
          - 336
          - 448
          rot_lim:
          - -3.6
          - 3.6
          H: 600
          W: 800
          rand_flip: false
          bot_pct_lim:
          - 0.0
          - 0.05
          cams:
          - camera0
          - camera1
          - camera2
          - camera3
          Ncams: 4
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: false
        camera_encoder: Resnet101
      camera_mask_args:
        cav_lidar_range: *id003
        grid_conf: *id004
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    fusion_backbone:
      resnext: true
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 1
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
      anchor_number: 2
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    in_head: 256
    anchor_number: 2
    dir_args:
      dir_offset: 0.7853
      num_bins: 2
      anchor_yaw:
      - 0
      - 90
    supervise_single: true
    in_head_single: 64
    stage: pretrain_m4
    codebook:
      seg_num: 2
      dict_size: 64
      r: 3
    fusion_method: max
    fusion_args:
      communication:
        thre: 0.0
        solver:
          thre: 1.0
          method: sum
loss:
  core_method: point_pillar_depth_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args:
        dir_offset: 0.7853
        num_bins: 2
        anchor_yaw:
        - 0
        - 90
    depth:
      weight: 1.0
optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 10
  - 25
seed: 303
time_delay: 0
codefilling_protocol:
  dataset: v2xset
  stage: pretrain_m4
  ego_modality: m4
  status: SERVER_VALIDATION_REQUIRED
  source_lock: docs/codefilling_sources/v2xset/lock.json
  budget_source: adaptation_template_requires_server_validation
  parents: []
  checkpoint_schema: codefilling_doma_v1
