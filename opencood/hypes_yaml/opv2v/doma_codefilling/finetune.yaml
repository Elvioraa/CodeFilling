name: CodeFilling_DOMA_opv2v_finetune
seed: 303
root_dir: dataset/OPV2V/train
validate_dir: dataset/OPV2V/validate
test_dir: dataset/OPV2V/test
yaml_parser: load_general_params
train_params:
  batch_size: 1
  epoches: 30
  max_cav: 5
  eval_freq: 1
  save_freq: 1
  single_weight: 1.0
comm_range: 70
input_source:
- lidar
- camera
- depth
label_type: lidar
cav_lidar_range: &id001
- -102.4
- -102.4
- -3
- 102.4
- 102.4
- 1
add_data_extension:
- bev_visibility.png
heter:
  assignment_path: opencood/modality_assign/opv2v_4modality.json
  ego_modality: m1
  lidar_channels_dict:
    m3: 32
  mapping_dict:
    m1: m1
    m2: m2
    m3: m3
    m4: m4
  modality_setting:
    m1:
      sensor_type: lidar
      core_method: point_pillar
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size:
          - 0.4
          - 0.4
          - 4
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range:
        - -102.4
        - -102.4
        - -3
        - 102.4
        - 102.4
        - 1
    m2:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf:
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
      data_aug_conf:
        resize_lim:
        - 0.65
        - 0.7
        final_dim:
        - 384
        - 512
        rot_lim:
        - -3.6
        - 3.6
        H: 600
        W: 800
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
    m3:
      sensor_type: lidar
      core_method: second
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size:
          - 0.1
          - 0.1
          - 0.1
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range:
        - -102.4
        - -102.4
        - -3
        - 102.4
        - 102.4
        - 1
    m4:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf:
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
      data_aug_conf:
        resize_lim:
        - 0.56
        - 0.61
        final_dim:
        - 336
        - 448
        rot_lim:
        - -3.6
        - 3.6
        H: 600
        W: 800
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
fusion:
  core_method: intermediateheter
  dataset: opv2v
  args:
    proj_first: false
    grid_conf: None
    data_aug_conf: None
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *id001
postprocess:
  core_method: VoxelPostprocessor
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id002
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 100
  nms_thresh: 0.15
  dir_args:
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id002
model:
  core_method: codefilling_doma
  args:
    ego_modality: m1
    lidar_range:
    - -102.4
    - -102.4
    - -3
    - 102.4
    - 102.4
    - 1
    supervise_single: true
    m1:
      core_method: point_pillar
      sensor_type: lidar
      encoder_args:
        voxel_size:
        - 0.4
        - 0.4
        - 4
        lidar_range:
        - -102.4
        - -102.4
        - -3
        - 102.4
        - 102.4
        - 1
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters:
          - 64
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
      aligner_args:
        core_method: identity
    m2:
      core_method: lift_splat_shoot
      sensor_type: camera
      encoder_args:
        anchor_number: 2
        grid_conf: &id003
          xbound:
          - -51.2
          - 51.2
          - 0.4
          ybound:
          - -51.2
          - 51.2
          - 0.4
          zbound:
          - -10
          - 10
          - 20.0
          ddiscr:
          - 2
          - 50
          - 48
          mode: LID
        data_aug_conf:
          resize_lim:
          - 0.65
          - 0.7
          final_dim:
          - 384
          - 512
          rot_lim:
          - -3.6
          - 3.6
          H: 600
          W: 800
          rand_flip: false
          bot_pct_lim:
          - 0.0
          - 0.05
          cams:
          - camera0
          - camera1
          - camera2
          - camera3
          Ncams: 4
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: EfficientNet
      camera_mask_args:
        cav_lidar_range:
        - -102.4
        - -102.4
        - -3
        - 102.4
        - 102.4
        - 1
        grid_conf: *id003
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    m3:
      core_method: second
      sensor_type: lidar
      encoder_args:
        voxel_size:
        - 0.1
        - 0.1
        - 0.1
        lidar_range:
        - -102.4
        - -102.4
        - -3
        - 102.4
        - 102.4
        - 1
        mean_vfe:
          num_point_features: 4
        spconv:
          num_features_in: 4
          num_features_out: 64
        map2bev:
          feature_num: 128
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 1
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    m4:
      core_method: lift_splat_shoot
      sensor_type: camera
      encoder_args:
        anchor_number: 2
        grid_conf: &id004
          xbound:
          - -51.2
          - 51.2
          - 0.4
          ybound:
          - -51.2
          - 51.2
          - 0.4
          zbound:
          - -10
          - 10
          - 20.0
          ddiscr:
          - 2
          - 50
          - 48
          mode: LID
        data_aug_conf:
          resize_lim:
          - 0.56
          - 0.61
          final_dim:
          - 336
          - 448
          rot_lim:
          - -3.6
          - 3.6
          H: 600
          W: 800
          rand_flip: false
          bot_pct_lim:
          - 0.0
          - 0.05
          cams:
          - camera0
          - camera1
          - camera2
          - camera3
          Ncams: 4
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: Resnet101
      camera_mask_args:
        cav_lidar_range:
        - -102.4
        - -102.4
        - -3
        - 102.4
        - 102.4
        - 1
        grid_conf: *id004
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: convnext
        spatial_align: false
        args:
          num_of_blocks: 3
          dim: 64
    fusion_backbone:
      resnext: true
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 1
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
      anchor_number: 2
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    in_head: 256
    anchor_number: 2
    dir_args:
      dir_offset: 0.7853
      num_bins: 2
      anchor_yaw:
      - 0
      - 90
    in_head_single: 64
    stage: finetune
    codebook:
      seg_num: 2
      dict_size: 64
      r: 3
    fusion_method: max
    fusion_args:
      communication:
        thre: 0.0
        solver:
          thre: 1.0
          method: sum
loss:
  core_method: point_pillar_depth_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args:
        dir_offset: 0.7853
        num_bins: 2
        anchor_yaw:
        - 0
        - 90
    depth:
      weight: 1.0
optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 30
data_augment: []
time_delay: 0
codefilling_protocol:
  dataset: opv2v
  stage: finetune
  ego_modality: m1
  status: SERVER_VALIDATION_REQUIRED
  source_lock: docs/codefilling_sources/opv2v/lock.json
  budget_source: adaptation_template_requires_server_validation
  parents:
  - codebook
  checkpoint_schema: codefilling_doma_v1
